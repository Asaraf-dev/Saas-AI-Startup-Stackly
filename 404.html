<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The page you are looking for could not be found.">
    <meta name="robots" content="noindex,nofollow">
    <title>404 - Page Not Found | SaaS & AI Startup</title>
    <!--- Favicon --->
    <link rel="icon" type="image/webp" href="assets/images/brand-logo.webp">
    <!--- Bootstrap --->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!--- Bootstrap Icons --->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--- Google Fonts --->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <!--- Global CSS --->
    <link rel="stylesheet" href="assets/css/global.css">
    <!--- 404 CSS --->
    <link rel="stylesheet" href="assets/css/404.css">
</head>

<body>
    <!--- 404 Page --->
    <main class="ss-404-page">
        <div class="ss-404-background">
            <span class="ss-404-grid"></span>
            <span class="ss-404-glow ss-404-glow-one"></span>
            <span class="ss-404-glow ss-404-glow-two"></span>
            <div class="ss-404-stars">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
        <div class="container">
            <div class="ss-404-content">
                <!--<a href="index.html" class="ss-404-logo" aria-label="SaaS & AI Startup Home"><img
                        src="assets/images/brand-logo.webp" alt="SaaS & AI Startup Logo"></a>-->
                <div class="ss-404-visual">
                    <div class="ss-404-orbit ss-404-orbit-one"></div>
                    <div class="ss-404-orbit ss-404-orbit-two"></div>
                    <div class="ss-404-orbit ss-404-orbit-three"></div>
                    <span class="ss-404-node ss-404-node-one"></span>
                    <span class="ss-404-node ss-404-node-two"></span>
                    <span class="ss-404-node ss-404-node-three"></span>
                    <div class="ss-404-core"><span>404</span></div>
                </div>
                <div class="ss-404-text">
                    <span class="ss-404-badge"><span class="ss-404-badge-dot"></span>System Response 404</span>
                    <h1 class="ss-404-title">Oops! This page <span>doesn't exist.</span></h1>
                    <p class="ss-404-description">The page you're looking for may have moved, been removed, or the link
                        might be incorrect.</p>
                    <div class="ss-404-actions">
                        <button type="button" class="ss-404-btn ss-404-btn-back" id="ss-404-back"><i
                                class="bi bi-arrow-left"></i><span>Go Back</span></button>
                        <a href="index.html" class="ss-404-btn ss-404-btn-home"><span>Go To Home</span><i
                                class="bi bi-arrow-up-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!--- 404 JavaScript --->
    <script src="assets/js/404.js"></script>
</body>

</html>
